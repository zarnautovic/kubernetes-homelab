# SQLite on Longhorn RWO, never NFS. Backups: tdeemon's own daily snapshots
# in /data/backups, and Longhorn's "default" group (backup-*-c jobs) takes
# the volume off the node; label the Volume CR into a nightly group once it
# exists (longhorn-system/recurring-jobs.yaml).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tdeemon-data
  namespace: tdeemon
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: longhorn
