# SQLite on Longhorn RWO, never NFS. Backups: tdeemon's own daily snapshots
# in /data/backups, and Longhorn's group nightly-a (labelled on the Volume
# CR, longhorn-system/recurring-jobs.yaml) takes the volume off the node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tdeemon-data
  namespace: tdeemon
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: longhorn
