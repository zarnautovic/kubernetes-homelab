# AdGuard Home — kućni DNS (blokiranje + .home imena). Plan i početne postavke: ~/projects/ADGUARD-PLAN.md
# - DNS za uređaje na LB IP 192.168.1.244 (router DHCP dijeli 192.168.1.244,192.168.1.1 — router je rezerva izvan racka)
# - Pod ima vlastite resolvere (dnsPolicy None) da ne rješava upstreame kroz sebe: čvorovi dobivaju .244 preko DHCP-a.
# - Prvi start sluša samo na :3000 (wizard) — zato liveness prihvaća 53 ILI 3000.
# - tolerationSeconds 30: kod pada čvora pod se seli za ~1 min umjesto defaultnih 5.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard
  namespace: adguard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: adguard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adguard
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 1.1.1.1
          - 9.9.9.9
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      containers:
        - name: adguard
          image: adguard/adguardhome:v0.107.79@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
          args:
            - --no-check-update
            - -c
            - /opt/adguardhome/conf/AdGuardHome.yaml
            - -w
            - /opt/adguardhome/work
          env:
            - name: TZ
              value: Europe/Zagreb
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: http
              containerPort: 80
              protocol: TCP
            - name: setup
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 53
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - nc -z 127.0.0.1 53 || nc -z 127.0.0.1 3000
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /opt/adguardhome/conf
              subPath: conf
            - name: data
              mountPath: /opt/adguardhome/work
              subPath: work
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: adguard-data
