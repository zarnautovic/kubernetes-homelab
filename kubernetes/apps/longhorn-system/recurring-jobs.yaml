# Backups are split into three staggered groups (a/b/c, balanced by actual
# volume size) so snapshot purge/coalescing never runs for all volumes at
# once. All slots start at 04:00 UTC or later because Proxmox vzdump backs up
# the node VMs at 02:00 UTC (04:00 local) from the same ZFS pool - the
# 2026-08-04 etcd election storm was the two backup jobs colliding.
#
# Volume -> group mapping lives as labels on the Longhorn Volume CRs:
#   recurring-job-group.longhorn.io/<a|b|c>: enabled
# Volumes without any recurring-job label fall into the "default" group,
# which is swept by the group-c jobs so new PVCs are always backed up.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-daily-a
  namespace: longhorn-system
spec:
  # Mon-Sat only: on Sundays the weekly backup replaces the daily one so the
  # two jobs never run in the same night.
  cron: "0 4 * * 1-6"
  task: backup
  groups:
    - a
  retain: 7
  concurrency: 1
  labels:
    cadence: daily
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-daily-b
  namespace: longhorn-system
spec:
  cron: "0 5 * * 1-6"
  task: backup
  groups:
    - b
  retain: 7
  concurrency: 1
  labels:
    cadence: daily
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-daily-c
  namespace: longhorn-system
spec:
  cron: "0 6 * * 1-6"
  task: backup
  groups:
    - c
    - default
  retain: 7
  concurrency: 1
  labels:
    cadence: daily
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-weekly-a
  namespace: longhorn-system
spec:
  # Sundays, replacing (not stacking on) the daily jobs.
  cron: "0 4 * * 0"
  task: backup
  groups:
    - a
  retain: 8
  concurrency: 1
  labels:
    cadence: weekly
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-weekly-b
  namespace: longhorn-system
spec:
  cron: "0 5 * * 0"
  task: backup
  groups:
    - b
  retain: 8
  concurrency: 1
  labels:
    cadence: weekly
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-weekly-c
  namespace: longhorn-system
spec:
  cron: "0 6 * * 0"
  task: backup
  groups:
    - c
    - default
  retain: 8
  concurrency: 1
  labels:
    cadence: weekly
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-monthly
  namespace: longhorn-system
spec:
  # 08:00 on the 1st keeps a >1h gap after the last daily/weekly slot (06:00
  # + ~30-60min) even when the 1st falls on any day of the week.
  cron: "0 8 1 * *"
  task: backup
  groups:
    - a
    - b
    - c
    - default
  retain: 6
  concurrency: 1
  labels:
    cadence: monthly
