# Vikunja — tasks/projects for the homelab (Kanban, CalDAV, built-in MCP server for agents).
# Single Go binary serves API + frontend on :3456. MCP endpoint: /api/v2/mcp (API-token auth, created in Settings → MCP).
# Login: local users (registration off); Authentik OIDC added via VIKUNJA_AUTH_OPENID_* once the provider exists.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vikunja
  namespace: vikunja
spec:
  replicas: 1
  # vikunja-files is RWO Longhorn
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vikunja
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vikunja
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vikunja
          image: vikunja/vikunja:2.7.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: VIKUNJA_SERVICE_PUBLICURL
              value: https://tasks.zlayahome.ovh/
            - name: VIKUNJA_SERVICE_TIMEZONE
              value: Europe/Zagreb
            - name: VIKUNJA_SERVICE_ENABLEREGISTRATION
              value: "false"
            - name: VIKUNJA_SERVICE_ENABLECALDAV
              value: "true"
            - name: VIKUNJA_DATABASE_TYPE
              value: postgres
            - name: VIKUNJA_DATABASE_HOST
              value: vikunja-postgres
            - name: VIKUNJA_FILES_BASEPATH
              value: /app/vikunja/files
            - name: VIKUNJA_LOG_LEVEL
              value: INFO
            - name: TZ
              value: Europe/Zagreb
          envFrom:
            - secretRef:
                name: vikunja
          ports:
            - name: http
              containerPort: 3456
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: files
              mountPath: /app/vikunja/files
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: files
          persistentVolumeClaim:
            claimName: vikunja-files
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vikunja
  namespace: vikunja
spec:
  selector:
    app.kubernetes.io/name: vikunja
  ports:
    - name: http
      port: 3456
      targetPort: http
