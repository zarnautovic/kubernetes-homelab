# Vikunja — tasks/projects for the homelab (Kanban, CalDAV, built-in MCP server for agents).
# Single Go binary serves API + frontend on :3456. MCP endpoint: /api/v2/mcp (API-token auth, created in Settings → MCP).
# Login: Authentik OIDC only (local login disabled; user "zlatan" is bound to the Authentik subject).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vikunja
  namespace: vikunja
  annotations:
    # restart when the SOPS secret changes (DB password / service secret)
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # vikunja-files is RWO Longhorn
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vikunja
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vikunja
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vikunja
          image: vikunja/vikunja:2.7.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: VIKUNJA_SERVICE_PUBLICURL
              value: https://tasks.zlayahome.ovh/
            - name: VIKUNJA_SERVICE_TIMEZONE
              value: Europe/Zagreb
            - name: VIKUNJA_SERVICE_ENABLEREGISTRATION
              value: "false"
            - name: VIKUNJA_SERVICE_ENABLECALDAV
              value: "true"
            - name: VIKUNJA_DATABASE_TYPE
              value: postgres
            - name: VIKUNJA_DATABASE_HOST
              value: vikunja-postgres
            - name: VIKUNJA_FILES_BASEPATH
              value: /app/vikunja/files
            # Authentik OIDC (provider "authentik" → callback /auth/openid/authentik); client secret in the SOPS secret.
            # emailfallback links the SSO identity to the existing local user with the same verified email.
            # Only Authentik SSO on the login page; API tokens (MCP) and CLI user management keep working.
            - name: VIKUNJA_AUTH_LOCAL_ENABLED
              value: "false"
            - name: VIKUNJA_AUTH_OPENID_ENABLED
              value: "true"
            - name: VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_NAME
              value: Authentik
            - name: VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_AUTHURL
              value: https://authentik.zlayahome.ovh/application/o/vikunja/
            - name: VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_LOGOUTURL
              value: https://authentik.zlayahome.ovh/application/o/vikunja/end-session/
            - name: VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_CLIENTID
              value: fzETmDuAaDxl0YFpOuv0LFVDBTe0N8hF1k4P6UVg
            - name: VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_SCOPE
              value: openid profile email
            - name: VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_EMAILFALLBACK
              value: "true"
            - name: VIKUNJA_LOG_LEVEL
              value: INFO
            - name: TZ
              value: Europe/Zagreb
          envFrom:
            - secretRef:
                name: vikunja
          ports:
            - name: http
              containerPort: 3456
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: files
              mountPath: /app/vikunja/files
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: files
          persistentVolumeClaim:
            claimName: vikunja-files
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vikunja
  namespace: vikunja
spec:
  selector:
    app.kubernetes.io/name: vikunja
  ports:
    - name: http
      port: 3456
      targetPort: http
