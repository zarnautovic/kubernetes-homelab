# JAVNI appovi iza Authentik ugrađenog outposta (proxy mod), kroz Cloudflare Tunnel.
# Gateway "public" nosi external-dns target (CNAME na tunel); proxied anotacija je ovdje.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: proxy-public
  namespace: authentik
  annotations:
    external-dns.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: public
      namespace: network
  hostnames:
    - "seerr.zlayahome.ovh"
  rules:
    - backendRefs:
        - name: authentik-server
          port: 80
