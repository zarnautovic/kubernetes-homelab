# PRIVATNI appovi iza Authentik ugrađenog outposta (proxy mod).
# Hostname -> authentik-server; outpost autentificira i proxyja na interni Service appa
# (internal_host u proxy provideru). Gateway "main" = LAN + Tailscale, external-dns radi
# A zapis na 192.168.1.240 (DNS-only), izvana nedostupno.
# Dodavanje appa: hostname ovdje + proxy provider/application u Authentiku.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: proxy-private
  namespace: authentik
spec:
  parentRefs:
    - name: main
      namespace: network
      sectionName: https-ovh
  hostnames:
    - "tautulli.zlayahome.ovh"
    - "radarr.zlayahome.ovh"
    - "sonarr.zlayahome.ovh"
    - "bazarr.zlayahome.ovh"
    - "prowlarr.zlayahome.ovh"
    - "qbittorrent.zlayahome.ovh"
    - "autobrr.zlayahome.ovh"
    - "longhorn.zlayahome.ovh"
    - "home.zlayahome.ovh"
    - "plex.zlayahome.ovh"
  rules:
    - backendRefs:
        - name: authentik-server
          port: 80
