apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 30m
  chart:
    spec:
      chart: authentik
      # Auto-patch within the current minor; minor/major bumps require a manual
      # edit so breaking DB migrations are reviewed before they roll out.
      version: ">=2026.8.0 <2026.9.0"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: authentik
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: authentik-secrets
      valuesKey: secret_key
      targetPath: authentik.secret_key
    - kind: Secret
      name: authentik-secrets
      valuesKey: postgresql_password
      targetPath: authentik.postgresql.password
    - kind: Secret
      name: authentik-secrets
      valuesKey: postgresql_password
      targetPath: postgresql.auth.password
  values:
    authentik:
      postgresql:
        host: "authentik-postgresql"
        name: authentik
        user: authentik
      web:
        # Obavezno od authentik 2026.11 (vidi release notes 2026.8); javni URL kroz tunel.
        base_url: https://authentik.zlayahome.ovh
    postgresql:
      enabled: true
      auth:
        username: authentik
        database: authentik
      primary:
        persistence:
          enabled: true
          storageClass: longhorn
          size: 8Gi
    server:
      ingress:
        enabled: false
