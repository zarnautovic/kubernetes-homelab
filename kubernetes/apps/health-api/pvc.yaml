apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: health-api-data
  namespace: health-api
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-ro
  namespace: health-api
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: ""
  volumeName: vault-mirror-health-nfs
