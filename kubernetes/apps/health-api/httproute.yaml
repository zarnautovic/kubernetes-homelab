apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: health-api
  namespace: health-api
spec:
  parentRefs:
    - name: main
      namespace: network
  hostnames:
    - "health.zlaya.tech"
  rules:
    # One hostname, two protection models — split at the Traefik VM:
    #   /health-metrics + /healthz  -> router WITHOUT authentik (the
    #     phone's HAE app authenticates with the Bearer token)
    #   everything else (dashboard, read APIs) -> router WITH the
    #     chain-authentik middleware
    # In-cluster we route the whole hostname to the service; the
    # tokenless read endpoints rely on that Traefik split externally.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: health-api
          port: 8080
