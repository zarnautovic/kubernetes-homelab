apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: health-api
  namespace: health-api
spec:
  parentRefs:
    - name: main
      namespace: network
  hostnames:
    - "health.zlaya.tech"
  rules:
    # One hostname, two protection models — split at the Traefik VM:
    #   /health-metrics + /healthz  -> router WITHOUT authentik (the
    #     phone's HAE app authenticates with the Bearer token)
    #   everything else (dashboard, read APIs) -> router WITH the
    #     chain-authentik middleware
    # Until that second Traefik router exists, this route deliberately
    # forwards ONLY the ingest paths — widening it to PathPrefix / with
    # the current single no-auth Traefik rule would publish the
    # dashboard to the internet unauthenticated.
    - matches:
        - path:
            type: Exact
            value: /health-metrics
        - path:
            type: Exact
            value: /healthz
      backendRefs:
        - name: health-api
          port: 8080
