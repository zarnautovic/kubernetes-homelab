apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: health-api
  namespace: health-api
spec:
  parentRefs:
    - name: main
      namespace: network
  hostnames:
    - "health.zlaya.tech"
  rules:
    # Deliberately expose ONLY the phone-facing ingest endpoint (plus
    # liveness): /rescan and /api/* stay cluster-internal even though
    # they are token-authed. The Traefik rule for this hostname has no
    # authentik chain — the Bearer token is the protection.
    - matches:
        - path:
            type: Exact
            value: /health-metrics
        - path:
            type: Exact
            value: /healthz
      backendRefs:
        - name: health-api
          port: 8080
