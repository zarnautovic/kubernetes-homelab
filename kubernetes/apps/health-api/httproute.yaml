apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: health-api
  namespace: health-api
spec:
  parentRefs:
    - name: main
      namespace: network
  hostnames:
    - "health.zlaya.tech"
  rules:
    # One hostname, two protection models — split at the Traefik VM:
    #   /health-metrics, /strong-import, /healthz -> router WITHOUT
    #     authentik; the phone (Health Auto Export, and the Shortcut that
    #     uploads the Strong CSV) authenticates with the Bearer token
    #   everything else (dashboard, read APIs) -> router WITH the
    #     chain-authentik middleware
    # The Traefik split is live (verified: anonymous / gets a 302 to
    # Authentik, /healthz stays open, an anonymous POST to
    # /strong-import gets a 401 from the API rather than a redirect), so
    # the whole hostname can flow to the service.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: health-api
          port: 8080
