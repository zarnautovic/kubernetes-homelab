apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
  namespace: immich
  annotations:
    # javno kroz Cloudflare Tunnel: Gateway "public" nosi target (CNAME na tunel), ovdje proxied
    external-dns.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    # nova domena, javno kroz tunel; app ima vlastiti OIDC login (bez Authentik proxyja)
    - name: public
      namespace: network
  hostnames:
    - "photos.zlayahome.ovh"
  rules:
    - backendRefs:
        - name: immich-server
          port: 2283
      # Envoy's default 15 s route timeout would cut long uploads/downloads.
      timeouts:
        request: 1h
        backendRequest: 1h
---
# LAN/Tailscale ruta za isti host: AdGuard rewrite photos.zlayahome.ovh -> 192.168.1.240
# (Gateway "main"), pa uploadi idu mimo Cloudflarea i njegovog limita od 100 MB.
# external-dns je MORA preskočiti: javni zapis je CNAME na tunel (ruta iznad), a A na .240
# za isto ime bi se s njim sudario.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich-lan
  namespace: immich
  annotations:
    external-dns.kubernetes.io/controller: none
spec:
  parentRefs:
    - name: main
      namespace: network
      sectionName: https-ovh
  hostnames:
    - "photos.zlayahome.ovh"
  rules:
    - backendRefs:
        - name: immich-server
          port: 2283
      timeouts:
        request: 1h
        backendRequest: 1h
