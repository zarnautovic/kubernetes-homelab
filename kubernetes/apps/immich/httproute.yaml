apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
  namespace: immich
  annotations:
    # javno kroz Cloudflare Tunnel: Gateway "public" nosi target (CNAME na tunel), ovdje proxied
    external-dns.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    # stara domena, samo zlaya.tech listener (dok traje selidba)
    - name: main
      namespace: network
      sectionName: https
    # nova domena, javno kroz tunel; app ima vlastiti OIDC login (bez Authentik proxyja)
    - name: public
      namespace: network
  hostnames:
    - "photos.zlaya.tech"
    - "photos.zlayahome.ovh"
  rules:
    - backendRefs:
        - name: immich-server
          port: 2283
      # Envoy's default 15 s route timeout would cut long uploads/downloads.
      timeouts:
        request: 1h
        backendRequest: 1h
