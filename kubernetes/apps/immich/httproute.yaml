apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
  namespace: immich
spec:
  parentRefs:
    - name: main
      namespace: network
  hostnames:
    - "photos.zlaya.tech"
  rules:
    - backendRefs:
        - name: immich-server
          port: 2283
      # Envoy's default 15 s route timeout would cut long uploads/downloads.
      timeouts:
        request: 1h
        backendRequest: 1h
