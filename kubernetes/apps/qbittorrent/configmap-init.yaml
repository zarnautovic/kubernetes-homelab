apiVersion: v1
kind: ConfigMap
metadata:
  name: qbittorrent-init
  namespace: qbittorrent
data:
  # LSIO images run every script in /custom-cont-init.d BEFORE starting the
  # app, so at this point no qbittorrent-nox can be running and any lockfile
  # is by definition stale. qBittorrent's own stale-lock detection compares
  # the stored PID against live processes, which is meaningless across
  # container restarts (fresh PID namespace -> the old PID often "exists" as
  # some unrelated s6/busybox process) and then it exits in a loop thinking
  # another instance is running. Seen 2026-08-03 after a node reboot and
  # 12.-24.07. (hundreds of qbittorrent.log.bak rotations).
  # Safe here because strategy=Recreate + RWO config PVC guarantee no second
  # live instance can hold the lock while this runs.
  10-remove-stale-lock.sh: |
    #!/bin/bash
    if [[ -f /config/qBittorrent/lockfile ]]; then
        echo "[remove-stale-lock] removing stale /config/qBittorrent/lockfile"
        rm -f /config/qBittorrent/lockfile
    fi
  # The WebUI auth whitelist lived only in qBittorrent.conf on the PVC; the
  # *arr apps and Homepage rely on it (no login from the LAN and the pod
  # network). Enforced here on every start so a reset/restored config gets it
  # back. Busybox awk: values go in via ENVIRON, because -v would treat the
  # backslash in "WebUI\..." as an escape.
  20-webui-whitelist.sh: |
    #!/bin/bash
    conf=/config/qBittorrent/qBittorrent.conf
    if [[ ! -f "$conf" ]]; then
        echo "[webui-whitelist] $conf missing, skipping"
        exit 0
    fi
    set_pref() {  # $1 = key below WebUI\, $2 = value
        local key="WebUI\\$1"
        if grep -qF "${key}=" "$conf"; then
            K="$key" V="$2" awk 'index($0, ENVIRON["K"] "=") == 1 { print ENVIRON["K"] "=" ENVIRON["V"]; next } { print }' "$conf" > "$conf.tmp"
        else
            K="$key" V="$2" awk '{ print } $0 == "[Preferences]" { print ENVIRON["K"] "=" ENVIRON["V"] }' "$conf" > "$conf.tmp"
        fi
        # cat keeps the owner/mode of the original file
        cat "$conf.tmp" > "$conf" && rm -f "$conf.tmp"
    }
    set_pref AuthSubnetWhitelistEnabled true
    set_pref AuthSubnetWhitelist "192.168.1.0/24, 10.244.0.0/16"
    echo "[webui-whitelist] WebUI auth whitelist enforced"
