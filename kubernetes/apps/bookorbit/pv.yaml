apiVersion: v1
kind: PersistentVolume
metadata:
  name: bookorbit-books-nfs
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 192.168.1.101
    # ZFS dataset main-pool/books (owner 3002:3002, quota 20 GiB, daily/monthly
    # snapshots, nightly replication to backup-pool/books).
    # library/ = Calibre library, dock/ = BookOrbit Book Dock drop folder.
    path: /mnt/main-pool/books
  claimRef:
    name: bookorbit-books
    namespace: bookorbit
