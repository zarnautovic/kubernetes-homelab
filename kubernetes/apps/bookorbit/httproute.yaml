apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookorbit
  namespace: bookorbit
  annotations:
    # javno kroz Cloudflare Tunnel: Gateway "public" nosi target (CNAME na tunel), ovdje proxied
    external-dns.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    # nova domena, javno kroz tunel; app ima vlastiti OIDC login (bez Authentik proxyja)
    - name: public
      namespace: network
  hostnames:
    - "books.zlayahome.ovh"
  rules:
    - backendRefs:
        - name: bookorbit
          port: 3000
      # Envoy's default 15 s route timeout would cut book uploads/downloads.
      timeouts:
        request: 30m
        backendRequest: 30m
