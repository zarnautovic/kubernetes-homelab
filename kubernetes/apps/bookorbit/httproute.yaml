apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookorbit
  namespace: bookorbit
spec:
  parentRefs:
    - name: main
      namespace: network
  hostnames:
    - "books.zlaya.tech"
  rules:
    - backendRefs:
        - name: bookorbit
          port: 3000
      # Envoy's default 15 s route timeout would cut book uploads/downloads.
      timeouts:
        request: 30m
        backendRequest: 30m
