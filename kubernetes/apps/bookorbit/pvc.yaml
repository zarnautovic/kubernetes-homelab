apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookorbit-books
  namespace: bookorbit
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  storageClassName: ""
  volumeName: bookorbit-books-nfs
---
# App data (covers, book bucket) — Longhorn, picked up by the default recurring backup group.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookorbit-data
  namespace: bookorbit
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
