apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-zlayahome-ovh-tls
  namespace: network
spec:
  secretName: wildcard-zlayahome-ovh-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "*.zlayahome.ovh"
  dnsNames:
    - "*.zlayahome.ovh"
    - "zlayahome.ovh"
