# Read-only: the audit only lists pods cluster-wide to collect running images.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-audit
  namespace: image-audit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: image-audit-pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: image-audit-pod-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: image-audit-pod-reader
subjects:
  - kind: ServiceAccount
    name: image-audit
    namespace: image-audit
---
# State between runs (last set of upgrade candidates) lives in a ConfigMap in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: image-audit-state
  namespace: image-audit
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: image-audit-state
  namespace: image-audit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: image-audit-state
subjects:
  - kind: ServiceAccount
    name: image-audit
    namespace: image-audit
