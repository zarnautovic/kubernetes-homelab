# Cloudflare Tunnel "k8s-homelab" (lokalno upravljana konfiguracija; dashboard ingress se ignorira).
# Sav promet *.zlayahome.ovh ide na javni Cilium Gateway "public" preko HTTPS-a; Host header prolazi netaknut,
# SNI je fiksiran na ime unutar wildcarda da Gateway odabere pravi listener/cert.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflared
data:
  config.yaml: |
    tunnel: b83ff200-e567-4121-ac90-c1e80bc1bbcf
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - hostname: "*.zlayahome.ovh"
        service: https://cilium-gateway-public.network.svc.cluster.local:443
        originRequest:
          originServerName: tunnel.zlayahome.ovh
          connectTimeout: 10s
      - service: http_status:404
