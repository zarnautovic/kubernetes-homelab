apiVersion: apps/v1
kind: Deployment
metadata:
  name: livesync-bridge
  namespace: obsidian-livesync
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: livesync-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: livesync-bridge
    spec:
      initContainers:
        # /app/dat must stay writable for runtime state, so the read-only
        # secret is copied in rather than mounted directly.
        - name: copy-config
          image: busybox:1.37
          command:
            - sh
            - -c
            - cp /config-readonly/config.json /app/dat/config.json
          volumeMounts:
            - name: config-readonly
              mountPath: /config-readonly
            - name: dat
              mountPath: /app/dat
      containers:
        - name: livesync-bridge
          image: ghcr.io/zarnautovic/livesync-bridge:f27f78c
          env:
            - name: TZ
              value: Europe/Zagreb
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: dat
              mountPath: /app/dat
            - name: vault-mirror
              mountPath: /app/data
        # Write API for agents. Shares the vault-mirror volume with the
        # bridge container, so its writes hit the same mount the bridge
        # watches — synced to CouchDB instantly, unlike external NFS
        # clients whose writes wait for a pod restart.
        - name: vault-webhook
          image: python:3.13-slim
          command: ["python", "/opt/webhook/webhook.py"]
          securityContext:
            runAsUser: 1993
            runAsGroup: 1993
          env:
            - name: VAULT_DIR
              value: /data/vault
            - name: WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-webhook-token
                  key: WEBHOOK_TOKEN
            # Narrower token for the phone's Apple Health export: it only
            # authorizes POST /health-metrics, never the /notes API.
            - name: HEALTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-webhook-token
                  key: HEALTH_TOKEN
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: vault-mirror
              mountPath: /data
            - name: webhook-script
              mountPath: /opt/webhook
      volumes:
        - name: config-readonly
          secret:
            secretName: livesync-bridge-config
        - name: dat
          emptyDir: {}
        - name: vault-mirror
          persistentVolumeClaim:
            claimName: vault-mirror
        - name: webhook-script
          configMap:
            name: vault-webhook-script
