apiVersion: v1
kind: PersistentVolume
metadata:
  name: vault-mirror-nfs
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 192.168.1.101
    path: /mnt/main-pool/vault-mirror
  claimRef:
    name: vault-mirror
    namespace: obsidian-livesync
