apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      securityContext:
        fsGroup: 10000
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:v2026.7.20
          args: ["gateway", "run"]
          # No TCP probes: the OpenAI-compatible API (8642) only listens
          # when explicitly enabled, and the image supervises the gateway
          # internally via s6 (auto-restart on crash).
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              # CPU limit is a sandbox boundary: the agent runs arbitrary
              # commands in-pod, so cap what a runaway process can take.
              cpu: "2"
              memory: 4Gi
          envFrom:
            - secretRef:
                name: hermes-env
          env:
            - name: TZ
              value: Europe/Zagreb
            # Read-only NFS mount of the Obsidian vault mirror; the bundled
            # obsidian skill resolves the vault through this variable.
            - name: OBSIDIAN_VAULT_PATH
              value: /vault
            # Writes go through the vault-webhook sidecar in the bridge pod
            # (reads stay on /vault) — see the vault-webhook skill.
            - name: VAULT_WEBHOOK_URL
              value: http://vault-webhook.obsidian-livesync.svc.cluster.local:8080
          ports:
            - name: api
              containerPort: 8642
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: vault
              mountPath: /vault
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: vault
          persistentVolumeClaim:
            claimName: vault-ro
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
