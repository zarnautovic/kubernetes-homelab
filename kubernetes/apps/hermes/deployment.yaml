apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      # OIDC calls to Authentik must not leave the LAN: the public DNS
      # route goes through Cloudflare, which 403s Python's urllib UA on
      # the JWKS fetch. Point the hostname at the internal gateway LB.
      hostAliases:
        - ip: "192.168.1.240"
          hostnames:
            - authentik.zlaya.tech
      securityContext:
        fsGroup: 10000
      containers:
        - name: hermes
          # Pinned by digest to the 2026-09-24 main build (upstream commit
          # 58c896ea): GPT-6 Sol/Luna model metadata landed on main on
          # 2026-09-22/23 and is not in any tagged release yet (v2026.9.21
          # predates it). Move back to a release tag once one ships with it.
          image: nousresearch/hermes-agent:latest@sha256:01d12091a6c933ab4420808ba2026cc622a67cb77aa74ef6c4e8a67f201691a5
          args: ["gateway", "run"]
          # No TCP probes: the OpenAI-compatible API (8642) only listens
          # when explicitly enabled, and the image supervises the gateway
          # internally via s6 (auto-restart on crash).
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              # CPU limit is a sandbox boundary: the agent runs arbitrary
              # commands in-pod, so cap what a runaway process can take.
              cpu: "2"
              memory: 4Gi
          envFrom:
            - secretRef:
                name: hermes-env
          env:
            - name: TZ
              value: Europe/Zagreb
            # Web dashboard on 9119; basic-auth credentials come from the
            # hermes-env secret (auth is mandatory on non-loopback binds).
            - name: HERMES_DASHBOARD
              value: "1"
            # SSO via Authentik (OIDC, public PKCE client — the ID is not
            # a secret). Basic auth from the secret stays as a fallback.
            - name: HERMES_DASHBOARD_OIDC_ISSUER
              value: https://authentik.zlaya.tech/application/o/hermes/
            - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
              value: SCLmsXzawFwx5Aa6CJh3tso1lLiNbELKkZzmuWSZ
            - name: HERMES_DASHBOARD_PUBLIC_URL
              value: https://hermes.zlaya.tech
            # Read-only NFS mount of the Obsidian vault mirror; the bundled
            # obsidian skill resolves the vault through this variable.
            - name: OBSIDIAN_VAULT_PATH
              value: /vault
            # Writes go through the vault-webhook sidecar in the bridge pod
            # (reads stay on /vault) — see the vault-webhook skill.
            - name: VAULT_WEBHOOK_URL
              value: http://vault-webhook.obsidian-livesync.svc.cluster.local:8080
            # Pre-computed health aggregates (weekly averages, TDEE) so
            # analyses don't re-read every daily note; token in hermes-env.
            - name: HEALTH_API_URL
              value: http://health-api.health-api.svc.cluster.local:8080
          ports:
            - name: api
              containerPort: 8642
            - name: dashboard
              containerPort: 9119
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: vault
              mountPath: /vault
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: vault
          persistentVolumeClaim:
            claimName: vault-ro
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
