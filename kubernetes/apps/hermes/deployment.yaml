apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      securityContext:
        fsGroup: 10000
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:v2026.7.20
          args: ["gateway", "run"]
          readinessProbe:
            tcpSocket:
              port: 8642
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8642
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              # CPU limit is a sandbox boundary: the agent runs arbitrary
              # commands in-pod, so cap what a runaway process can take.
              cpu: "2"
              memory: 4Gi
          envFrom:
            - secretRef:
                name: hermes-env
          env:
            - name: TZ
              value: Europe/Zagreb
          ports:
            - name: api
              containerPort: 8642
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: vault
              mountPath: /vault
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: vault
          persistentVolumeClaim:
            claimName: vault-ro
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
