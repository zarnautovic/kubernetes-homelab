apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      # /app/config must be writable: on start Homepage copies every missing
      # skeleton file into it, so a release that adds one crashes on a
      # read-only ConfigMap mount. Copy the ConfigMap into an emptyDir
      # instead; Reloader (annotation above) still restarts the pod when the
      # ConfigMap changes. Same image only because it has sh + cp.
      initContainers:
        - name: copy-config
          image: ghcr.io/gethomepage/homepage:v2.4.0
          command: ["sh", "-c", "cp -L /config-src/* /app/config/"]
          volumeMounts:
            - name: config-src
              mountPath: /config-src
              readOnly: true
            - name: config
              mountPath: /app/config
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.4.0
          readinessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          ports:
            - containerPort: 3000
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "home.zlayahome.ovh"
          envFrom:
            - secretRef:
                name: homepage-secrets
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config-src
          configMap:
            name: homepage
        - name: config
          emptyDir: {}
