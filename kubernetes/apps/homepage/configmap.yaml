apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: Homelab
    theme: dark
    color: slate
    layout:
      Servers:
        icon: mdi-server
        style: row
        columns: 3
      Apps:
        icon: mdi-apps
        style: row
        columns: 2
      Security:
        icon: mdi-shield-lock
      Media:
        icon: mdi-play-circle
        style: row
        columns: 4
      Health:
        icon: mdi-heart-pulse
      AI:
        icon: mdi-robot
    providers:
      longhorn:
        url: http://longhorn-frontend.longhorn-system
  bookmarks.yaml: |
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com/zarnautovic
  services.yaml: |
    - Servers:
        - Proxmox:
            icon: proxmox.svg
            href: "https://192.168.1.10:8006"
            widget:
              type: proxmox
              url: "https://192.168.1.10:8006"
              username: "{{HOMEPAGE_VAR_PROXMOX_USER}}"
              password: "{{HOMEPAGE_VAR_PROXMOX_KEY}}"
        - TrueNAS:
            icon: truenas-scale.png
            href: "https://192.168.1.101"
            widget:
              type: truenas
              url: "https://192.168.1.101"
              key: "{{HOMEPAGE_VAR_TRUENAS_KEY}}"
              enablePools: true
              nasType: scale
              # 2 = websocket API (/api/current); 1 (default) = REST, which
              # TrueNAS 26.04 removes (RESTAPIUsage alert until 6.10.2026)
              version: 2
        - AdGuard Home:
            icon: adguard-home.svg
            href: "https://adguard.zlayahome.ovh"
            description: kućni DNS 192.168.1.244
            widget:
              type: adguard
              url: http://adguard-web.adguard.svc.cluster.local
              username: admin
              password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
    - Apps:
        - Immich:
            icon: immich.svg
            href: "https://photos.zlayahome.ovh"
            description: fotografije i video
            widget:
              type: immich
              url: http://immich-server.immich.svc.cluster.local:2283
              key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"
              version: 2
        - BookOrbit:
            icon: mdi-book-open-page-variant
            href: "https://books.zlayahome.ovh"
            description: knjige, čitač, KOReader sync
            siteMonitor: http://bookorbit.bookorbit.svc.cluster.local:3000/api/v1/health
        - Vikunja:
            icon: vikunja.svg
            href: "https://tasks.zlayahome.ovh"
            description: zadaci i planovi za homelab (Kanban, MCP)
            siteMonitor: http://vikunja.vikunja.svc.cluster.local:3456/health
            widget:
              type: vikunja
              url: http://vikunja.vikunja.svc.cluster.local:3456
              key: "{{HOMEPAGE_VAR_VIKUNJA_KEY}}"
              version: 2
              enableTaskList: true
    - Media:
        - Plex:
            icon: plex.svg
            href: "https://plex.zlayahome.ovh"
            widget:
              type: plex
              url: http://plex.plex.svc.cluster.local:32400
              key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"
        - Seerr:
            icon: jellyseerr.svg
            href: "https://seerr.zlayahome.ovh"
            widget:
              type: jellyseerr
              url: http://seerr.seerr.svc.cluster.local:5055
              key: "{{HOMEPAGE_VAR_SEERR_KEY}}"
        - Tautulli:
            icon: tautulli.svg
            href: "https://tautulli.zlayahome.ovh"
            widget:
              type: tautulli
              url: http://tautulli.tautulli.svc.cluster.local:8181
              key: "{{HOMEPAGE_VAR_TAUTULLI_KEY}}"
        - qBittorrent:
            icon: qbittorrent.svg
            href: "https://qbittorrent.zlayahome.ovh"
            widget:
              type: qbittorrent
              url: http://qbittorrent.qbittorrent.svc.cluster.local:8080
              username: "{{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}"
              password: "{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}"
        - Sonarr:
            icon: sonarr.svg
            href: "https://sonarr.zlayahome.ovh"
            widget:
              type: sonarr
              url: http://sonarr.sonarr.svc.cluster.local:8989
              key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
        - Radarr:
            icon: radarr.svg
            href: "https://radarr.zlayahome.ovh"
            widget:
              type: radarr
              url: http://radarr.radarr.svc.cluster.local:7878
              key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
        - Prowlarr:
            icon: prowlarr.svg
            href: "https://prowlarr.zlayahome.ovh"
            widget:
              type: prowlarr
              url: http://prowlarr.prowlarr.svc.cluster.local:9696
              key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
        - Bazarr:
            icon: bazarr.svg
            href: "https://bazarr.zlayahome.ovh"
            widget:
              type: bazarr
              url: http://bazarr.bazarr.svc.cluster.local:6767
              key: "{{HOMEPAGE_VAR_BAZARR_KEY}}"
    - Health:
        - Health Dashboard:
            icon: mdi-heart-pulse
            href: "https://health.zlayahome.ovh"
            description: kilaža, unos, san, trening
            widget:
              type: customapi
              url: http://health-api.health-api.svc.cluster.local:8080/stats?window=28d
              refreshInterval: 300000
              mappings:
                - field:
                    current: kilaza_last
                  label: Kilaža
                  format: float
                  suffix: " kg"
                - field:
                    kilaza_trend: kg_per_week
                  label: kg/tjedan
                  format: float
                - field:
                    tdee: measured
                  label: TDEE
                  format: number
                - field:
                    targets: kilaza_milestone
                  label: Cilj
                  format: number
                  suffix: " kg"
    - AI:
        - Hermes:
            icon: mdi-robot
            href: "https://hermes.zlayahome.ovh"
            description: Autonomous agent — dashboard
    - Security:
        - Authentik:
            icon: authentik.svg
            href: "https://authentik.zlayahome.ovh"
            widget:
              type: authentik
              url: http://authentik-server.authentik.svc.cluster.local
              key: "{{HOMEPAGE_VAR_AUTHENTIK_KEY}}"
              version: 2
  widgets.yaml: |
    - greeting:
        text: Welcome
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: homelab
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - longhorn:
        expanded: true
        total: true
        labels: true
        nodes: true
  docker.yaml: |
    {}
