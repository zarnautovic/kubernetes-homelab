apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tdeemon
  namespace: flux-system
spec:
  interval: 10m
  # A dependency that is reconciling the same revision (longhorn) makes it
  # wait; try again after a minute, not the whole interval.
  retryInterval: 1m
  path: ./kubernetes/apps/tdeemon
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: longhorn
    - name: gateway
