# iscsid config for the siderolabs/iscsi-tools extension (Longhorn volumes).
#
# Why: the open-iscsi defaults ping the target every 5s and drop the session
# after a single 5s timeout. During the nightly Longhorn backup the hypervisor
# disk stalls for >5s, the session drops mid-write and ext4 journals abort
# (read-only filesystems on Plex/hermes volumes, nights of 2026-08-02/03).
# With interval 10s + timeout 30s a session survives a ~40s stall; queued I/O
# then completes instead of erroring out.
#
# Applied to all three nodes with:
#   talosctl -n 192.168.1.143,192.168.1.136,192.168.1.135 \
#     patch machineconfig --patch @iscsid-extension-config.yaml
# (also add as --config-patch when rebuilding a node, see README.md)
#
# NOTE: settings take effect per-session at iSCSI login time, i.e. when a
# Longhorn volume (re)attaches. Existing sessions keep the old 5s timeouts
# until the workload pod moves/restarts or the node reboots.
apiVersion: v1alpha1
kind: ExtensionServiceConfig
name: iscsid
configFiles:
  - mountPath: /etc/iscsi/iscsid.conf
    content: |
      iscsid.startup = /sbin/iscsid
      node.startup = manual
      node.leading_login = No
      # Keep queueing I/O for up to 120s while a session recovers (default,
      # made explicit) instead of failing writes to the filesystem.
      node.session.timeo.replacement_timeout = 120
      node.conn[0].timeo.login_timeout = 15
      node.conn[0].timeo.logout_timeout = 15
      # Defaults are 5/5 - too aggressive for a hypervisor disk that stalls
      # under backup load. Ping every 10s, declare dead only after 30s.
      node.conn[0].timeo.noop_out_interval = 10
      node.conn[0].timeo.noop_out_timeout = 30
      # SCSI error-handler timeouts, raised from 15s for the same reason.
      node.session.err_timeo.abort_timeout = 30
      node.session.err_timeo.lu_reset_timeout = 30
      node.session.err_timeo.tgt_reset_timeout = 30
      node.session.initial_login_retry_max = 8
      node.session.cmds_max = 128
      node.session.queue_depth = 32
      node.session.xmit_thread_priority = -20
      node.session.iscsi.InitialR2T = No
      node.session.iscsi.ImmediateData = Yes
      node.session.iscsi.FirstBurstLength = 262144
      node.session.iscsi.MaxBurstLength = 16776192
      node.conn[0].iscsi.MaxRecvDataSegmentLength = 262144
      node.conn[0].iscsi.MaxXmitDataSegmentLength = 0
      discovery.sendtargets.iscsi.MaxRecvDataSegmentLength = 32768
      node.conn[0].iscsi.HeaderDigest = None
      node.session.nr_sessions = 1
      node.session.reopen_max = 0
      node.session.iscsi.FastAbort = Yes
      node.session.scan = auto
